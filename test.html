<!DOCTYPE html>
<html>
<head>
    <title>Part 107 Sectional Chart Locator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" 
          href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #header {
            padding: 12px;
            background: #1d3557;
            color: white;
            text-align: center;
        }

        button {
            padding: 12px 18px;
            font-size: 16px;
            margin-top: 8px;
            cursor: pointer;
        }

        #map {
            height: calc(100vh - 120px);
            width: 100%;
        }

        #status {
            margin-top: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="header">
    <h2>Part 107 Sectional Chart Locator</h2>

    <button onclick="locatePilot()">
        📍 Find My Location
    </button>

    <div id="status">
        Press button to locate pilot position
    </div>
</div>

<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([39.8283, -98.5795], 4);


// Base map
L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: 'OpenStreetMap'
    }
).addTo(map);


// Placeholder for FAA sectional layer
// Future:
// L.tileLayer("FAA_SECTIONAL_TILE_URL/{z}/{x}/{y}.png")
//     .addTo(map);


let marker;


function locatePilot() {

    const status = document.getElementById("status");

    if (!navigator.geolocation) {
        status.innerHTML = 
            "Geolocation is not supported by this browser.";
        return;
    }


    status.innerHTML = 
        "Requesting GPS location...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            let lat = position.coords.latitude;
            let lon = position.coords.longitude;


            status.innerHTML =
                `
                Latitude: ${lat.toFixed(6)}<br>
                Longitude: ${lon.toFixed(6)}
                `;


            if(marker) {
                map.removeLayer(marker);
            }


            marker = L.marker([lat, lon])
                .addTo(map)
                .bindPopup(
                    `
                    <b>Pilot Location</b><br>
                    ${lat.toFixed(5)}, ${lon.toFixed(5)}
                    `
                )
                .openPopup();


            map.setView(
                [lat, lon],
                12
            );

        },


        function(error) {

            status.innerHTML =
                "Unable to retrieve location: " 
                + error.message;

        },

        {
            enableHighAccuracy: true,
            timeout: 10000
        }

    );
}

</script>

</body>
</html>

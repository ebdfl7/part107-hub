<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part 107 Briefing Room — Charts & Weather Drill</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root{
    --navy:#0B1E33;
    --navy-deep:#071523;
    --tan:#EFE7D4;
    --tan-line:#d8cba9;
    --blue:#1E5AA8;
    --magenta:#B32E76;
    --amber:#E39B3A;
    --green:#3E7A4E;
    --ink:#1c2430;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--navy-deep);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(30,90,168,0.18), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(179,46,118,0.14), transparent 45%);
    color:var(--tan);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:840px;margin:0 auto;padding:28px 18px 80px;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:2px solid var(--tan-line);
    padding-bottom:16px; margin-bottom:22px;
    position:relative;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .rose{width:46px;height:46px;flex:none;}
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.35rem; margin:0; letter-spacing:.3px; color:#fff;
  }
  .sub{font-family:'IBM Plex Mono', monospace; font-size:.72rem; color:var(--tan-line); margin-top:2px;}

  #progress-wrap{width:100%; height:6px; background:rgba(239,231,212,0.12); border-radius:4px; overflow:hidden; margin:14px 0 26px;}
  #progress-bar{height:100%; width:0%; background:linear-gradient(90deg, var(--blue), var(--magenta)); transition:width .35s ease;}

  .meta-row{display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--tan-line); margin-bottom:6px;}

  .card{
    background:var(--tan); color:var(--ink);
    border-radius:10px; padding:22px 22px 24px;
    box-shadow:0 12px 34px rgba(0,0,0,.35);
    border:1px solid var(--tan-line);
  }

  .qtag{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:.7rem;
    background:var(--navy); color:var(--tan); padding:3px 9px; border-radius:20px;
    letter-spacing:.5px; margin-bottom:12px;
  }
  .qtext{font-size:1.05rem; font-weight:600; line-height:1.45; margin:0 0 16px;}

  .figure{
    background:#fff; border:1px solid var(--tan-line); border-radius:8px;
    padding:10px; margin-bottom:18px; display:flex; align-items:center; justify-content:center;
  }
  .figure svg{max-width:100%; height:auto; display:block;}
  .fig-caption{font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:#6b6152; text-align:center; margin-top:6px;}

  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; border:1.5px solid var(--tan-line); background:#fbf8f0;
    border-radius:8px; padding:11px 14px; cursor:pointer; font-size:.94rem;
    font-family:'IBM Plex Sans',sans-serif; color:var(--ink);
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--blue); background:#f2f4fa;}
  .opt.correct{background:#e4f1e6; border-color:var(--green); font-weight:600;}
  .opt.incorrect{background:#f7e3e9; border-color:var(--magenta); font-weight:600;}
  .opt:disabled{cursor:default;}

  .explain{
    margin-top:16px; padding:12px 14px; border-left:4px solid var(--blue);
    background:#f2f0e6; border-radius:0 6px 6px 0; font-size:.88rem; line-height:1.5; display:none;
  }
  .explain.show{display:block;}

  .flash{
    position:fixed; top:22px; left:50%; transform:translateX(-50%) translateY(-16px);
    background:var(--green); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:1rem; padding:10px 26px; border-radius:30px; box-shadow:0 8px 22px rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; z-index:50;
    letter-spacing:.5px;
  }
  .flash.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .navrow{display:flex; justify-content:flex-end; margin-top:18px;}
  .btn{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:.9rem;
    background:var(--navy); color:var(--tan); border:none; border-radius:7px;
    padding:10px 20px; cursor:pointer;
  }
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn:hover:not(:disabled){background:#12314f;}

  /* results screen */
  .results{text-align:center; padding:30px 10px;}
  .seal{
    width:120px;height:120px;margin:0 auto 18px; border-radius:50%;
    border:4px solid var(--navy); display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--navy);
    transform:rotate(-8deg);
  }
  .score-num{font-size:2.1rem;}
  .review-list{text-align:left; margin-top:20px; display:flex; flex-direction:column; gap:8px;}
  .review-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; border-radius:7px; background:#fbf8f0; border:1px solid var(--tan-line); font-size:.85rem;
  }
  .pill{font-family:'IBM Plex Mono',monospace; font-size:.72rem; padding:2px 9px; border-radius:20px; color:#fff;}
  .pill.ok{background:var(--green);}
  .pill.no{background:var(--magenta);}

  footer{
    text-align:center; margin-top:30px; font-family:'IBM Plex Mono',monospace;
    font-size:.68rem; color:var(--tan-line); opacity:.6;
  }

  @media (prefers-reduced-motion: reduce){
    #progress-bar{transition:none;}
  }

  .sync-note{
    margin-top:18px; padding-top:14px; border-top:1px dashed var(--tan-line);
    font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:#7a7259;
    letter-spacing:.03em; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .reset-link{
    background:transparent; border:none; color:#7a7259;
    font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.03em;
    text-decoration:underline; cursor:pointer; padding:2px;
  }
  .reset-link:hover{ color:var(--magenta); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg class="rose" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#EFE7D4" stroke-width="2"/>
        <path d="M50 6 L56 50 L50 94 L44 50 Z" fill="#EFE7D4"/>
        <path d="M6 50 L50 44 L94 50 L50 56 Z" fill="#B32E76"/>
        <circle cx="50" cy="50" r="4" fill="#1E5AA8"/>
      </svg>
      <div>
        <h1>Weather &amp; Charts Briefing</h1>
        <div class="sub">PART 107 DRILL · AVIATION WEATHER + SECTIONAL SYMBOLOGY</div>
      </div>
    </div>
  </header>

  <div id="quiz-area">
    <div class="meta-row">
      <span id="q-counter">Question 1 of —</span>
      <span id="q-score">Correct: 0</span>
    </div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div class="card" id="card"></div>
  </div>

  <div id="results-area" style="display:none;"></div>
  <div class="flash" id="flash">Correct</div>

  <footer>FIELD LABORATORY SEVEN · STUDY TOOL, NOT AN OFFICIAL FAA PRODUCT · VERIFY AGAINST CURRENT AIM / 14 CFR PART 107</footer>
</div>

<script src="progress.js"></script>
<script>
// Unique id this drill's results are saved under — read back by index.html
// to show pass/fail status on the Mission Hub.
const PROGRESS_ITEM_ID = 'wx-challenge';

const QUESTIONS = [

{
  tag:"METAR",
  q:"You pull the following METAR before a flight. What does the 'BKN008' group tell you?",
  fig:`<div style="font-family:'IBM Plex Mono',monospace;font-size:.92rem;background:#0B1E33;color:#EFE7D4;padding:16px;border-radius:6px;width:100%;line-height:1.6;">
        KTTA 111853Z 21009KT 7SM BKN008 OVC015 22/19 A2996
      </div>`,
  cap:"METAR — Sample surface observation",
  opts:[
    "Broken clouds at 800 feet AGL",
    "Broken clouds at 8,000 feet AGL",
    "Winds broken from 008 degrees",
    "Base of a cumulonimbus at 800 feet MSL"
  ],
  correct:0,
  why:"Cloud height groups in a METAR are reported in hundreds of feet AGL. BKN008 = broken ceiling at 800 feet AGL — a legal-relevant number since Part 107 caps you at 400 feet AGL (or within 400 feet of a structure)."
},

{
  tag:"TAF",
  q:"A TAF includes 'FM111800 22015G25KT P6SM SCT025'. What changes at 1800Z?",
  fig:`<div style="font-family:'IBM Plex Mono',monospace;font-size:.92rem;background:#0B1E33;color:#EFE7D4;padding:16px;border-radius:6px;width:100%;line-height:1.6;">
        TAF KTTA 111740Z 1118/1218<br>
        20012KT P6SM SCT040<br>
        FM111800 22015G25KT P6SM SCT025
      </div>`,
  cap:"TAF excerpt — FM (from) group",
  opts:[
    "Wind shifts to 220° at 15kt gusting 25kt, visibility greater than 6SM, scattered clouds at 2,500 ft",
    "Wind shifts to 220° at 15kt gusting 25kt, visibility exactly 6SM, few clouds at 2,500 ft",
    "A frontal passage bringing 220 knots of wind",
    "Temperature falls to 22°C at 1800Z"
  ],
  correct:0,
  why:"'FM' introduces a new forecast period with a significant change. P6SM means visibility greater than 6 statute miles, and SCT025 is scattered clouds at 2,500 ft AGL. Gusting winds above ~20kt are a key go/no-go factor for small UAS."
},

{
  tag:"SECTIONAL",
  q:"You're planning a flight near an airport. The sectional shows this airspace boundary around the field. What class of airspace is depicted?",
  fig:`<svg viewBox="0 0 320 220" width="320">
        <rect width="320" height="220" fill="#f4efe0"/>
        <circle cx="160" cy="110" r="90" fill="none" stroke="#1E5AA8" stroke-width="3"/>
        <circle cx="160" cy="110" r="60" fill="none" stroke="#1E5AA8" stroke-width="3"/>
        <circle cx="160" cy="110" r="30" fill="none" stroke="#1E5AA8" stroke-width="3"/>
        <circle cx="160" cy="110" r="4" fill="#1E5AA8"/>
        <text x="160" y="20" text-anchor="middle" font-size="11" fill="#1c2430" font-family="IBM Plex Mono, monospace">SFC-100 / 30-60 / 60-80</text>
      </svg>`,
  cap:"Sectional excerpt — solid blue rings, tiered shelves",
  opts:[
    "Class B — solid blue tiered rings around a major airport",
    "Class C — solid magenta rings",
    "Class D — blue dashed circle",
    "Class G — no boundary shown at all"
  ],
  correct:0,
  why:"Class B airspace is drawn as solid blue lines forming tiered, upside-down-wedding-cake rings around the primary airport. Class C uses solid magenta; Class D uses a dashed blue line."
},

{
  tag:"SECTIONAL",
  q:"This boundary style around an airport indicates which airspace class — and what does it mean for your Part 107 flight?",
  fig:`<svg viewBox="0 0 320 220" width="320">
        <rect width="320" height="220" fill="#f4efe0"/>
        <circle cx="160" cy="110" r="70" fill="none" stroke="#1E5AA8" stroke-width="3" stroke-dasharray="8 6"/>
        <circle cx="160" cy="110" r="4" fill="#1E5AA8"/>
        <text x="160" y="30" text-anchor="middle" font-size="11" fill="#1c2430" font-family="IBM Plex Mono, monospace">Dashed blue circle</text>
      </svg>`,
  cap:"Sectional excerpt — dashed blue ring",
  opts:[
    "Class D — you need ATC authorization (e.g. via LAANC) before flying there",
    "Class D — no authorization is ever required for sUAS",
    "Class E surface area — always off-limits to drones",
    "Restricted area — permanently no-fly"
  ],
  correct:0,
  why:"A dashed blue circle marks Class D surface airspace, typically around towered airports without radar approach control. Remote pilots need ATC authorization to operate there — most often granted instantly through LAANC."
},

{
  tag:"SECTIONAL",
  q:"On a sectional chart, this number stack next to a spot elevation tells you the height of an obstacle. What do the two numbers represent?",
  fig:`<svg viewBox="0 0 260 160" width="260">
        <rect width="260" height="160" fill="#f4efe0"/>
        <line x1="130" y1="40" x2="130" y2="120" stroke="#1c2430" stroke-width="3"/>
        <polygon points="130,40 122,55 138,55" fill="#1c2430"/>
        <text x="150" y="70" font-size="16" fill="#1c2430" font-family="IBM Plex Mono, monospace">1780</text>
        <text x="150" y="90" font-size="14" fill="#1c2430" font-family="IBM Plex Mono, monospace">(456)</text>
      </svg>`,
  cap:"Obstacle symbol with elevation figures",
  opts:[
    "Top number = MSL height, number in parentheses = height AGL",
    "Top number = AGL height, parentheses = MSL height",
    "Both numbers are the same value in different units",
    "The parentheses number is the FCC registration number"
  ],
  correct:0,
  why:"Sectional obstacle symbols list the obstacle's top elevation above mean sea level first, with the height above ground level in parentheses beneath it — critical for judging clearance above your 400 ft AGL ceiling."
},

{
  tag:"SURFACE ANALYSIS",
  q:"On a surface analysis chart, this front symbol is approaching your operating area. What kind of front is it, and what hazard should you expect?",
  fig:`<svg viewBox="0 0 300 100" width="300">
        <rect width="300" height="100" fill="#f4efe0"/>
        <line x1="20" y1="50" x2="280" y2="50" stroke="#1E5AA8" stroke-width="3"/>
        <polygon points="60,50 75,38 90,50" fill="#1E5AA8"/>
        <polygon points="140,50 155,38 170,50" fill="#1E5AA8"/>
        <polygon points="220,50 235,38 250,50" fill="#1E5AA8"/>
      </svg>`,
  cap:"Front symbol — solid blue line with triangles",
  opts:[
    "Cold front — expect a narrow band of possible strong, gusty winds and quick-forming cumulus/cumulonimbus",
    "Warm front — expect widespread low stratus and steady drizzle over a wide area",
    "Occluded front — no weather impact expected",
    "Stationary front — pressure will rise sharply within the hour"
  ],
  correct:0,
  why:"Solid blue triangles pointing in the direction of movement mark a cold front. Cold fronts move fast and can trigger sudden gusty winds, towering cumulus, and thunderstorms along a relatively narrow line — a fast-changing go/no-go situation for sUAS."
},

{
  tag:"SURFACE ANALYSIS",
  q:"This front symbol (solid red line, half-circles) is forecast to move through late this afternoon. What should you plan for?",
  fig:`<svg viewBox="0 0 300 100" width="300">
        <rect width="300" height="100" fill="#f4efe0"/>
        <line x1="20" y1="50" x2="280" y2="50" stroke="#B32E76" stroke-width="3"/>
        <circle cx="75" cy="38" r="9" fill="none" stroke="#B32E76" stroke-width="3"/>
        <circle cx="155" cy="38" r="9" fill="none" stroke="#B32E76" stroke-width="3"/>
        <circle cx="235" cy="38" r="9" fill="none" stroke="#B32E76" stroke-width="3"/>
      </svg>`,
  cap:"Front symbol — solid red/magenta line with half-circles",
  opts:[
    "Warm front — lowering ceilings, widespread stratus, and reduced visibility well ahead of passage",
    "Cold front — a sudden squall line with no advance warning",
    "Dry line — a sharp moisture gradient with no cloud effects",
    "This symbol only appears on winds aloft charts, not surface charts"
  ],
  correct:0,
  why:"Red half-circles mark a warm front. Warm fronts tend to bring gradually lowering ceilings, layered stratus clouds, and visibility that degrades well before the front physically arrives — often the bigger low-altitude hazard for sUAS than the front line itself."
},

{
  tag:"STATION MODEL",
  q:"This simplified station model shows sky cover as a filled circle. How much of the sky is covered?",
  fig:`<svg viewBox="0 0 200 200" width="200">
        <rect width="200" height="200" fill="#f4efe0"/>
        <circle cx="100" cy="100" r="45" fill="none" stroke="#1c2430" stroke-width="3"/>
        <path d="M100 55 A45 45 0 0 1 100 145 Z" fill="#1c2430"/>
      </svg>`,
  cap:"Sky cover symbol — half-filled circle",
  opts:[
    "Sky obscured — half of the circle is shaded, meaning scattered to broken transition (roughly 4/8 to 5/8 coverage)",
    "Completely clear sky",
    "Completely overcast sky",
    "Circle shading has nothing to do with cloud coverage"
  ],
  correct:0,
  why:"Station models fill the circle proportionally to cloud coverage in eighths (octas). A half-filled circle corresponds to roughly 4/8 sky coverage — in METAR terms, right around the scattered/broken boundary."
},

{
  tag:"CEILING/SKY COVER",
  q:"Match the cloud coverage terms to their correct order (least to most coverage) as used in METARs and weather depiction charts.",
  fig:`<svg viewBox="0 0 340 130" width="340">
        <rect width="340" height="130" fill="#f4efe0"/>
        <g font-family="IBM Plex Mono, monospace" font-size="12" fill="#1c2430">
          <circle cx="40" cy="40" r="22" fill="none" stroke="#1c2430" stroke-width="2"/>
          <text x="40" y="80" text-anchor="middle">FEW</text>
          <circle cx="120" cy="40" r="22" fill="none" stroke="#1c2430" stroke-width="2"/>
          <path d="M120 18 A22 22 0 0 1 138 52 L120 40 Z" fill="#1c2430"/>
          <text x="120" y="80" text-anchor="middle">SCT</text>
          <circle cx="200" cy="40" r="22" fill="none" stroke="#1c2430" stroke-width="2"/>
          <path d="M200 18 A22 22 0 1 1 179 52 L200 40 Z" fill="#1c2430"/>
          <text x="200" y="80" text-anchor="middle">BKN</text>
          <circle cx="280" cy="40" r="22" fill="#1c2430" stroke="#1c2430" stroke-width="2"/>
          <text x="280" y="80" text-anchor="middle">OVC</text>
        </g>
      </svg>`,
  cap:"Sky cover progression: FEW → SCT → BKN → OVC",
  opts:[
    "FEW (1-2/8) < SCT (3-4/8) < BKN (5-7/8) < OVC (8/8)",
    "OVC (1-2/8) < BKN (3-4/8) < SCT (5-7/8) < FEW (8/8)",
    "All four terms mean the same coverage, just different chart types",
    "FEW and SCT both mean fully overcast"
  ],
  correct:0,
  why:"Coverage increases FEW (1-2 octas) → SCT (3-4 octas) → BKN (5-7 octas) → OVC (8 octas, fully overcast). A 'ceiling' by definition is the lowest BKN or OVC layer, or vertical visibility into an obscuration."
},

{
  tag:"CLOUDS",
  q:"This towering cloud with a flattened, anvil-shaped top is forming near your operating area. What hazard does it signal?",
  fig:`<svg viewBox="0 0 300 200" width="300">
        <rect width="300" height="200" fill="#dceaf5"/>
        <ellipse cx="150" cy="60" rx="95" ry="18" fill="#e9e4d6"/>
        <path d="M90 70 Q100 20 150 25 Q160 5 200 20 Q230 25 220 60 Q240 70 210 85 L100 85 Q70 85 90 70 Z" fill="#f2efe6" stroke="#8b8672" stroke-width="1"/>
        <path d="M110 85 Q120 140 100 190 M150 85 Q160 150 145 190 M190 85 Q195 145 205 190" stroke="#6b7280" stroke-width="2" fill="none" opacity=".55"/>
      </svg>`,
  cap:"Cumulonimbus with anvil top",
  opts:[
    "Thunderstorm cell — expect turbulence, lightning, gusty/shifting surface winds, and possible hail beneath it",
    "Fair-weather cumulus — no operational concern",
    "Fog bank forming at the surface",
    "Contrail from high-altitude traffic, no surface effect"
  ],
  correct:0,
  why:"A cumulonimbus with an anvil top is a mature or dying thunderstorm cell. It brings turbulence, lightning, hail, and gusty outflow winds that can extend miles ahead of the visible cloud — a hard no-fly indicator."
},

{
  tag:"CLOUDS",
  q:"You see this smooth, lens-shaped cloud sitting stationary downwind of a ridge line. What does it indicate?",
  fig:`<svg viewBox="0 0 300 160" width="300">
        <rect width="300" height="160" fill="#dceaf5"/>
        <polygon points="0,160 90,60 160,160" fill="#7a8f6b"/>
        <ellipse cx="190" cy="55" rx="80" ry="20" fill="#f2efe6" stroke="#8b8672" stroke-width="1"/>
      </svg>`,
  cap:"Lenticular cloud downwind of terrain",
  opts:[
    "Mountain wave activity — signals strong, potentially severe turbulence and rotor winds downwind of terrain",
    "Guaranteed calm, smooth air at all altitudes",
    "An indicator of imminent fog formation only",
    "A sign that visibility will be unrestricted for the rest of the day"
  ],
  correct:0,
  why:"Lenticular (lens-shaped) clouds form in the crest of a mountain wave. Their smooth appearance is deceptive — the wave and any rotor beneath it can produce severe turbulence, especially relevant for small, lightweight UAS."
},

{
  tag:"WINDS ALOFT",
  q:"You check the Winds and Temperatures Aloft forecast (FD) before a flight near a ridge. Reading '2721+08' at the 6,000 ft line, what does this decode to?",
  fig:`<div style="font-family:'IBM Plex Mono',monospace;font-size:.85rem;background:#0B1E33;color:#EFE7D4;padding:16px;border-radius:6px;width:100%;line-height:1.9;">
        FT &nbsp;3000 &nbsp;6000 &nbsp;9000<br>
        &nbsp;&nbsp;&nbsp;&nbsp; 2113 &nbsp; 2721+08 &nbsp; 2532+03
      </div>`,
  cap:"Winds/Temps Aloft (FD) excerpt",
  opts:[
    "Wind from 270° at 21 knots, temperature +8°C",
    "Wind from 027° at 21 knots, temperature -8°C",
    "Wind from 210° at 27 knots, temperature +8°C",
    "Barometric pressure of 2721 millibars"
  ],
  correct:0,
  why:"The first two digits (27) give wind direction in tens of degrees = 270°. The next two (21) are wind speed in knots. The final figure is temperature in Celsius, positive only below 24,000 ft where it's explicitly marked with a '+'."
},

{
  tag:"DENSITY ALTITUDE",
  q:"This density altitude chart shows a hot, high-elevation day. What's the operational takeaway for small multirotor UAS?",
  fig:`<svg viewBox="0 0 320 200" width="320">
        <rect width="320" height="200" fill="#f4efe0"/>
        <line x1="40" y1="20" x2="40" y2="170" stroke="#1c2430" stroke-width="2"/>
        <line x1="40" y1="170" x2="300" y2="170" stroke="#1c2430" stroke-width="2"/>
        <text x="10" y="20" font-size="10" font-family="IBM Plex Mono, monospace">DA(ft)</text>
        <text x="280" y="185" font-size="10" font-family="IBM Plex Mono, monospace">Temp</text>
        <polyline points="40,150 110,120 180,85 250,45" fill="none" stroke="#B32E76" stroke-width="3"/>
        <text x="120" y="70" font-size="11" fill="#B32E76" font-family="IBM Plex Mono, monospace">rising steeply →</text>
      </svg>`,
  cap:"Density altitude vs. temperature (fixed field elevation)",
  opts:[
    "As density altitude rises, air is less dense — expect reduced lift, sluggish climb performance, and shorter available flight time",
    "Density altitude has no effect on electric multirotor drones",
    "Rising density altitude always means increased battery efficiency",
    "This chart is only relevant to fixed-wing turbine aircraft"
  ],
  correct:0,
  why:"Higher density altitude means thinner effective air. Rotors and propellers generate less lift and thrust for the same RPM, motors work harder to compensate, and battery endurance and climb performance both suffer — worth checking on hot days at higher-elevation sites."
},

{
  tag:"WEATHER DEPICTION",
  q:"A Weather Depiction Chart shows your route crossing from an area outlined by a smooth line into one outlined by a scalloped line. What's the difference?",
  fig:`<svg viewBox="0 0 320 160" width="320">
        <rect width="320" height="160" fill="#f4efe0"/>

let current = 0;
let score = 0;
const answers = [];

const cardEl = document.getElementById('card');
const counterEl = document.getElementById('q-counter');
const scoreEl = document.getElementById('q-score');
const barEl = document.getElementById('progress-bar');
const quizArea = document.getElementById('quiz-area');
const resultsArea = document.getElementById('results-area');

function renderQuestion(i){
  const item = QUESTIONS[i];
  counterEl.textContent = `Question ${i+1} of ${QUESTIONS.length}`;
  scoreEl.textContent = `Correct: ${score}`;
  barEl.style.width = `${(i/QUESTIONS.length)*100}%`;

  let optsHtml = item.opts.map((o, idx) => `<button class="opt" data-idx="${idx}">${o}</button>`).join('');

  cardEl.innerHTML = `
    <span class="qtag">${item.tag}</span>
    <p class="qtext">${item.q}</p>
    <div class="figure">${item.fig}</div>
    <div class="fig-caption">${item.cap}</div>
    <div class="options">${optsHtml}</div>
    <div class="explain" id="explain-box">${item.why}</div>
    <div class="navrow"><button class="btn" id="next-btn" disabled>Next →</button></div>
  `;

  const optButtons = cardEl.querySelectorAll('.opt');
  const explainBox = cardEl.querySelector('#explain-box');
  const nextBtn = cardEl.querySelector('#next-btn');
  const flashEl = document.getElementById('flash');
  let answered = false;

  function goNext(){
    if(current < QUESTIONS.length - 1){
      current++;
      renderQuestion(current);
    } else {
      showResults();
    }
  }

  optButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      if(answered) return;
      answered = true;
      const chosen = parseInt(btn.dataset.idx, 10);
      const isCorrect = chosen === item.correct;
      if(isCorrect) score++;
      answers[i] = isCorrect;

      optButtons.forEach(b => {
        b.disabled = true;
        const bi = parseInt(b.dataset.idx, 10);
        if(bi === item.correct) b.classList.add('correct');
        else if(bi === chosen) b.classList.add('incorrect');
      });

      scoreEl.textContent = `Correct: ${score}`;

      if(isCorrect){
        flashEl.classList.add('show');
        setTimeout(() => flashEl.classList.remove('show'), 700);
        setTimeout(goNext, 850);
      } else {
        explainBox.classList.add('show');
        nextBtn.disabled = false;
      }
    });
  });

  nextBtn.addEventListener('click', goNext);
}

function showResults(){
  barEl.style.width = `100%`;
  quizArea.style.display = 'none';
  resultsArea.style.display = 'block';

  const pct = Math.round((score/QUESTIONS.length)*100);
  const pass = pct >= 70;

  let listHtml = QUESTIONS.map((q, i) => `
    <div class="review-item">
      <span>${i+1}. ${q.tag} — ${q.q.slice(0, 54)}${q.q.length>54 ? '…' : ''}</span>
      <span class="pill ${answers[i] ? 'ok':'no'}">${answers[i] ? 'CORRECT':'MISSED'}</span>
    </div>
  `).join('');

  resultsArea.innerHTML = `
    <div class="card results">
      <div class="seal" style="border-color:${pass ? '#3E7A4E':'#B32E76'}; color:${pass ? '#3E7A4E':'#B32E76'};">
        <div>
          <div class="score-num">${pct}%</div>
        </div>
      </div>
      <h2 style="font-family:'Space Grotesk',sans-serif; margin:6px 0;">${pass ? 'Briefed and ready' : 'Back to the charts'}</h2>
      <p style="font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:#3d3626;">
        ${score} of ${QUESTIONS.length} correct — Part 107 practice pass mark is 70%.
      </p>
      <div class="review-list">${listHtml}</div>
      <div class="navrow" style="justify-content:center; margin-top:22px;">
        <button class="btn" id="retry-btn">Retake drill</button>
      </div>
      <div class="sync-note">
        <span id="progressSavedNote"></span>
        <button class="reset-link" id="resetProgressBtn" type="button">RESET SAVED RESULT</button>
      </div>
    </div>
  `;

  document.getElementById('retry-btn').addEventListener('click', () => {
    current = 0; score = 0; answers.length = 0;
    quizArea.style.display = 'block';
    resultsArea.style.display = 'none';
    renderQuestion(0);
  });

  // Share this result with the Mission Hub (index.html). Every run overwrites
  // the previous one, so the number shown there always reflects the latest attempt.
  Part107Progress.recordResult(PROGRESS_ITEM_ID, {
    score: score,
    total: QUESTIONS.length,
    passThreshold: 0.7
  });
  document.getElementById('progressSavedNote').textContent =
    `Saved to Mission Hub — ${pass ? 'PASSED' : 'NOT PASSED'} (${score}/${QUESTIONS.length}).`;
  document.getElementById('resetProgressBtn').addEventListener('click', () => {
    if (confirm('Reset your saved result for the Weather & Charts Briefing Challenge?')) {
      Part107Progress.reset(PROGRESS_ITEM_ID);
      document.getElementById('progressSavedNote').textContent = 'Saved result cleared.';
    }
  });
}

renderQuestion(current);
</script>
